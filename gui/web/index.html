<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ascaniusfish</title>
<link rel="stylesheet" href="vendor/chessground.base.css">
<link rel="stylesheet" href="vendor/chessground.brown.css">
<link rel="stylesheet" href="vendor/chessground.cburnett.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Ascaniusfish</h1>
  <nav id="modes" aria-label="Mode">
    <button data-mode="analyse">Analyse</button>
    <button data-mode="play">Play</button>
    <button data-mode="watch">Watch</button>
  </nav>
  <span id="link" title="connection to the engine server"></span>
</header>

<main>
  <section class="board-column">
    <div class="board-row">
      <div id="evalbar" class="evalbar" hidden aria-hidden="true">
        <div class="evalbar-fill"></div>
      </div>
      <div class="board-frame">
        <div id="board"></div>
        <div id="promotion" class="promotion cg-wrap" hidden></div>
      </div>
    </div>
    <p id="status" class="status"></p>
  </section>

  <aside>
    <p id="mode-note" class="note"></p>

    <div class="controls">
      <button id="new">New game</button>
      <button id="undo">Take back</button>
      <button id="flip">Flip board</button>
      <button id="resign" hidden>Resign</button>
    </div>

    <section class="panel" id="play-panel" hidden>
      <h2>Ascaniusfish</h2>
      <p id="engine" class="engine"></p>
      <div class="field">
        <span class="label">You play</span>
        <div id="sides" class="controls">
          <button data-side="white">White</button>
          <button data-side="black">Black</button>
          <button data-side="random">Random</button>
        </div>
      </div>
      <form id="limit-form" class="field" autocomplete="off">
        <span class="label">Engine thinks</span>
        <div class="controls">
          <select id="limit-kind" aria-label="Search limit">
            <option value="depth">to depth</option>
            <option value="movetime">for ms</option>
          </select>
          <input id="limit-value" type="number" min="1" step="1" aria-label="Limit value">
          <button type="submit">Apply</button>
        </div>
      </form>
      <p class="note">Changing either setting starts a new game from the position
      the current game started from.</p>
    </section>

    <section class="panel" id="analysis-panel" hidden>
      <h2>Analysis</h2>
      <div class="analysis-head">
        <button id="analysis-toggle"></button>
        <span id="analysis-score" class="score"></span>
      </div>
      <p id="analysis-stats" class="note"></p>
      <p id="analysis-line" class="line"></p>
    </section>

    <section class="panel">
      <h2>Moves</h2>
      <div id="nav" class="controls nav">
        <button data-nav="start" title="Start of the game (Home)" aria-label="Start of the game">&#x23EE;</button>
        <button data-nav="back" title="One move back (left arrow)" aria-label="One move back">&#x25C0;</button>
        <button data-nav="forward" title="One move on (right arrow)" aria-label="One move on">&#x25B6;</button>
        <button data-nav="end" title="End of this line (End)" aria-label="End of this line">&#x23ED;</button>
        <button data-nav="prev" title="Previous variation (up arrow)" aria-label="Previous variation">&#x2191;</button>
        <button data-nav="next" title="Next variation (down arrow)" aria-label="Next variation">&#x2193;</button>
      </div>
      <div id="moves" class="moves"></div>
      <div class="controls">
        <button id="promote" title="Make the line you are on the main line">Promote</button>
        <button id="delete-move" title="Delete this move and everything after it">Delete</button>
      </div>
    </section>

    <section class="panel">
      <h2>Position</h2>
      <form id="fen-form" autocomplete="off">
        <input id="fen" type="text" spellcheck="false" aria-label="FEN">
        <div class="controls">
          <button type="submit">Load FEN</button>
          <button type="button" id="copy-fen">Copy</button>
        </div>
      </form>
      <p id="message" class="message" hidden></p>
    </section>

    <section class="panel">
      <h2>Game</h2>
      <form id="pgn-form" autocomplete="off">
        <textarea id="pgn" rows="7" spellcheck="false" aria-label="PGN"></textarea>
        <div class="controls">
          <button type="submit">Load PGN</button>
          <button type="button" id="copy-pgn">Copy</button>
          <a id="download-pgn" class="button" download="ascaniusfish.pgn">Download</a>
        </div>
      </form>
      <p class="note">Variations are written as nested parentheses, so a game
      saved here comes back with its side lines.</p>
    </section>
  </aside>
</main>

<script type="module" src="app.js"></script>
</body>
</html>

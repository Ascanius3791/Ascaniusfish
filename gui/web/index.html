<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ascaniusfish</title>
<link rel="stylesheet" href="vendor/chessground.base.css">
<link rel="stylesheet" href="vendor/chessground.brown.css">
<link rel="stylesheet" href="vendor/chessground.cburnett.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Ascaniusfish</h1>
  <nav id="modes" aria-label="Mode">
    <button data-mode="analyse">Analyse</button>
    <button data-mode="play">Play</button>
    <button data-mode="watch">Watch</button>
  </nav>
  <span id="link" title="connection to the engine server"></span>
</header>

<main>
  <section class="board-column">
    <div class="board-row">
      <div id="evalbar" class="evalbar" hidden aria-hidden="true">
        <div class="evalbar-fill"></div>
      </div>
      <div class="board-frame">
        <div id="board"></div>
        <div id="promotion" class="promotion" hidden>
          <p>Promote to</p>
          <div class="promotion-pieces">
            <button data-piece="q">Queen</button>
            <button data-piece="r">Rook</button>
            <button data-piece="b">Bishop</button>
            <button data-piece="n">Knight</button>
          </div>
          <button class="cancel" data-piece="">Cancel</button>
        </div>
      </div>
    </div>
    <p id="status" class="status"></p>
  </section>

  <aside>
    <p id="mode-note" class="note"></p>

    <div class="controls">
      <button id="new">New game</button>
      <button id="undo">Take back</button>
      <button id="flip">Flip board</button>
      <button id="resign" hidden>Resign</button>
    </div>

    <section class="panel" id="play-panel" hidden>
      <h2>Ascaniusfish</h2>
      <p id="engine" class="engine"></p>
      <div class="field">
        <span class="label">You play</span>
        <div id="sides" class="controls">
          <button data-side="white">White</button>
          <button data-side="black">Black</button>
          <button data-side="random">Random</button>
        </div>
      </div>
      <form id="limit-form" class="field" autocomplete="off">
        <span class="label">Engine thinks</span>
        <div class="controls">
          <select id="limit-kind" aria-label="Search limit">
            <option value="depth">to depth</option>
            <option value="movetime">for ms</option>
          </select>
          <input id="limit-value" type="number" min="1" step="1" aria-label="Limit value">
          <button type="submit">Apply</button>
        </div>
      </form>
      <p class="note">Changing either setting starts a new game from the position
      the current game started from.</p>
    </section>

    <section class="panel" id="analysis-panel" hidden>
      <h2>Analysis</h2>
      <div class="analysis-head">
        <button id="analysis-toggle"></button>
        <span id="analysis-score" class="score"></span>
      </div>
      <p id="analysis-stats" class="note"></p>
      <p id="analysis-line" class="line"></p>
    </section>

    <section class="panel">
      <h2>Moves</h2>
      <ol id="history" class="history"></ol>
    </section>

    <section class="panel">
      <h2>Position</h2>
      <form id="fen-form" autocomplete="off">
        <input id="fen" type="text" spellcheck="false" aria-label="FEN">
        <div class="controls">
          <button type="submit">Load FEN</button>
          <button type="button" id="copy-fen">Copy</button>
        </div>
      </form>
      <p id="message" class="message" hidden></p>
    </section>
  </aside>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
